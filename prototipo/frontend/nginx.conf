# Entrada pública del prototipo (simula ALB + CDN de las Iteraciones 3 y 4).
upstream api_gateway {
    # En la Fase 6 se agregan réplicas del backend para demostrar el balanceo (QA-02 / QA-07).
    server backend:3000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
