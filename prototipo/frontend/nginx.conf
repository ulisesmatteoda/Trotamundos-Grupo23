# Entrada pública del prototipo (simula ALB + CDN de las Iteraciones 3 y 4).
upstream api_gateway {
    # En la Fase 6 se agregan réplicas del backend para demostrar el balanceo (QA-02 / QA-07).
    server backend:3000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # API: nunca se cachea en el borde (son datos privados de cada usuario).
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # CDN (ADR-007): los bundles llevan un hash en el nombre, así que se cachean "para siempre".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Paquetes de idioma (ADR-008): cacheables, pero se revalidan para tomar traducciones nuevas
    # sin redesplegar la aplicación.
    location /locales/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # index.html no se cachea, para que cada despliegue apunte a los bundles nuevos.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
