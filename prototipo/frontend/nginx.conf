# Entrada pública del prototipo (simula ALB + CDN de las Iteraciones 3 y 4).
# Pool de réplicas stateless del backend (ADR-006). "backend" resuelve a todas las réplicas
# que levanta docker compose; nginx reparte en round-robin y saca de rotación a la que falla.
upstream api_gateway {
    server backend:3000 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

# Los healthchecks de Docker (wget) no se registran, para que no tapen los logs.
map $http_user_agent $registrar_acceso {
    ~^Wget  0;
    default 1;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$registrar_acceso;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # API: nunca se cachea en el borde (son datos privados de cada usuario).
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Failover (QA-02): si una réplica no responde, la petición se reintenta en otra.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # CDN (ADR-007): los bundles llevan un hash en el nombre, así que se cachean "para siempre".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Paquetes de idioma (ADR-008): cacheables, pero se revalidan para tomar traducciones nuevas
    # sin redesplegar la aplicación.
    location /locales/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # index.html no se cachea, para que cada despliegue apunte a los bundles nuevos.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
