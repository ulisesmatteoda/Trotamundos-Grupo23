# Prototipo Trotamundos — topología local que refleja la Vista de Despliegue (Iteración 3).
# Se publican al host: la entrada web (8080), la consola de RabbitMQ (15672) y el
# simulador de sistemas externos (4000). Las bases (primario, réplica y DW) solo son
# accesibles dentro de la red de Docker.

x-backend-env: &backend-env
  DATABASE_URL: postgres://trotamundos:trotamundos@postgres:5432/trotamundos
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://trotamundos:trotamundos@rabbitmq:5672
  # Secreto de firma de los JWT (ADR-005). Valor de demo: en un entorno real viene del KMS.
  JWT_SECRET: trotamundos-demo-jwt-secret-no-usar-en-produccion
  # Secreto compartido con los sistemas externos que llaman a los webhooks.
  WEBHOOK_SECRET: &webhook-secret trotamundos-demo-webhook-secret
  AGENCIAS_URL: http://mocks:4000
  # KMS simulado (ADR-005): clave maestra AES-256 de demo. En un entorno real vive en el KMS
  # y el backend nunca la ve; acá se inyecta por entorno.
  KMS_CLAVE_MAESTRA: RH2zkhMvIf3bzrzfRlinyMaqeBF5zZM0/z0daaQcZoA=
  KMS_CLAVE_ID: kms-v1
  # Cliente OAuth2 registrado en el proveedor de correo simulado (CON-02).
  CORREO_OAUTH_URL: http://mocks:4000/correo
  CORREO_AUTORIZACION_URL: http://localhost:4000/oauth/autorizar
  CORREO_CLIENT_ID: trotamundos
  CORREO_CLIENT_SECRET: &correo-secret trotamundos-demo-oauth-secret
  # Redes sociales simuladas (QA-03c): token de la aplicación Trotamundos.
  SOCIAL_URL: http://mocks:4000/social
  SOCIAL_TOKEN_APP: &social-token trotamundos-demo-social-token
  URL_PUBLICA: http://localhost:8080

services:
  # --- Capa de Datos -------------------------------------------------------
  # PostgreSQL OLTP Primary (Iteración 3)
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "max_replication_slots=5"]
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: trotamundos
      REPLICACION_PASSWORD: &replicacion-password trotamundos-demo-replicacion
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/primario:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # PostgreSQL Read Replica (ADR-004): hot standby por streaming, fuente exclusiva del ETL.
  postgres-replica:
    image: postgres:16-alpine
    user: postgres
    entrypoint: ["/bin/sh", "/replica/iniciar.sh"]
    environment:
      PGPASSWORD: *replicacion-password
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./postgres/replica:/replica:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Data Warehouse (OLAP) con modelo en estrella (ADR-004)
  dw:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analitica
      POSTGRES_PASSWORD: analitica
      POSTGRES_DB: trotamundos_dw
    volumes:
      - dwdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitica -d trotamundos_dw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis In-Memory Cache (ADR-007)
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Event Bus / Message Broker (ADR-003)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: trotamundos
      RABBITMQ_DEFAULT_PASS: trotamundos
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Capa de Aplicación --------------------------------------------------
  # API Gateway + Lógica de Negocio (ADR-001). Dos réplicas stateless detrás de nginx (ADR-006).
  backend:
    build: ./backend
    deploy:
      replicas: 2
    command: ["node", "dist/server.js"]
    environment:
      <<: *backend-env
      PORT: "3000"
      SEED_DEMO: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Workers asincrónicos (ADR-003, ADR-006). Escalables con --scale worker=N
  worker:
    build: ./backend
    command: ["node", "dist/workers/main.js"]
    environment:
      <<: *backend-env
      # Frecuencia del ArchivadoJob; corta para que se vea en la demo.
      ARCHIVADO_INTERVALO_MS: "30000"
    depends_on:
      rabbitmq: { condition: service_healthy }
      # La API aplica las migraciones al arrancar.
      backend: { condition: service_healthy }
    restart: unless-stopped

  # ETL Pipeline Worker (ADR-004): lee solo de la réplica y carga el Data Warehouse.
  etl:
    build: ./backend
    command: ["node", "dist/etl/main.js"]
    environment:
      REPLICA_URL: postgres://trotamundos:trotamundos@postgres-replica:5432/trotamundos
      DW_URL: postgres://analitica:analitica@dw:5432/trotamundos_dw
      ETL_SAL_ANONIMIZACION: trotamundos-demo-sal-etl
      # En producción, una corrida diaria (datos T-1); en la demo, cada minuto.
      ETL_INTERVALO_MS: "60000"
    depends_on:
      postgres-replica: { condition: service_healthy }
      dw: { condition: service_healthy }
      backend: { condition: service_healthy }
    restart: unless-stopped

  # --- Sistemas externos simulados -----------------------------------------
  mocks:
    build: ./mocks
    environment:
      PORT: "4000"
      # Los sistemas externos entran por la puerta pública (nginx → API Gateway)
      TROTAMUNDOS_URL: http://web/api
      WEBHOOK_SECRET: *webhook-secret
      OAUTH_CLIENT_SECRET: *correo-secret
      SOCIAL_TOKEN_APP: *social-token
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Capa de Presentación + entrada pública ------------------------------
  # nginx: sirve el SPA (CDN) y reenvía /api al Gateway (ALB)
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  pgdata-replica:
  dwdata:
